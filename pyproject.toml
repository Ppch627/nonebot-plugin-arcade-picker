[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "nonebot-plugin-arcade-picker"
version = "0.1.0"
description = "NoneBot2 插件：发送定位网页获取用户实时位置，按距离/舞萌DX机台数/单局价格综合评分推荐附近机厅（数据源 Nearcade，币价参考美团/抖音）"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "arcade-picker" }]
dependencies = [
    "nonebot2[fastapi]>=2.3.0",
    "nonebot-adapter-onebot>=2.4.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio"]

[tool.setuptools.packages.find]
include = ["nonebot_plugin_arcade_picker*"]

[tool.nonebot]
plugins = ["nonebot_plugin_arcade_picker"]
